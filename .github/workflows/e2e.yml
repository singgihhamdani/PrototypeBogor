name: End-to-End Automation Testing (Playwright)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  e2e-test:
    name: Run SIJAKON E2E Test Suite
    timeout-minutes: 20
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: prototype

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: prototype/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Fixture Documents (Excel, CSV, PDF)
        run: npm run test:e2e:prep

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests (Live Vercel Deployment)
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Test Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: prototype/playwright-report/
          retention-days: 14
