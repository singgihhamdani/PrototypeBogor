version: '3.8'

services:
  # 1. PostgreSQL 16 with PostGIS 3.4
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sijakon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sijakon_admin
      POSTGRES_PASSWORD: SijakonBogor2026!
      POSTGRES_DB: sijakon_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sijakon_admin -d sijakon_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sijakon-network

  # 2. Redis Cache & BullMQ Queue
  redis:
    image: redis:7-alpine
    container_name: sijakon-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sijakon-network

  # 3. MinIO S3-Compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: sijakon-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_sijakon_admin
      MINIO_ROOT_PASSWORD: MinioSijakonSecret2026!
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - sijakon-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  sijakon-network:
    driver: bridge
